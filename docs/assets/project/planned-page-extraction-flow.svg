<title id="title">Planned one-page extraction workflow</title>
<desc id="desc">All steps and connections are planned. A researcher supplies page text and source details. The model extracts environmental result rows. The researcher inspects an unconfirmed table using search, filters, and sorting. The app keeps a local run record and explains failed or unclear extraction without a successful result list.</desc>
